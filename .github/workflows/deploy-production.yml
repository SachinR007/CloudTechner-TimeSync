name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      create_db_backup:
        description: Create a PostgreSQL dump before deployment
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      DATABASE_URL: postgresql://timesheet_app:timesheet_ci_password@127.0.0.1:5432/timesheet_ci
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret-ci-only
      AUTH_URL: http://127.0.0.1:3111
      AUTH_TRUST_HOST: "true"
      ENABLE_CREDENTIALS_LOGIN: "true"
      SSO_ALLOWED_EMAIL_DOMAIN: "@cloudtechner.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate before deploy
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npm run build
          npm audit --audit-level=moderate

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/ct_orbit_prod
          chmod 600 ~/.ssh/ct_orbit_prod
          ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VM
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_APP_PATH: ${{ secrets.PROD_APP_PATH }}
          PROD_REPO_READ_TOKEN: ${{ secrets.PROD_REPO_READ_TOKEN }}
          CREATE_DB_BACKUP: ${{ inputs.create_db_backup }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/ct_orbit_prod "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "CT_ORBIT_FETCH_URL='https://x-access-token:${PROD_REPO_READ_TOKEN}@github.com/cloudtechner/ct-orbit.git' CT_ORBIT_APP_PATH='${PROD_APP_PATH:-/home/timesheet/timesheet-app}' CT_ORBIT_BRANCH='${DEPLOY_REF}' CT_ORBIT_BACKUP_DB='${CREATE_DB_BACKUP}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${CT_ORBIT_APP_PATH}"

          if [ "${CT_ORBIT_BACKUP_DB}" = "true" ]; then
            bash scripts/prod-db-backup.sh
          fi

          bash scripts/prod-deploy.sh
REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ct_orbit_prod
