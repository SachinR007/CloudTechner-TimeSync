name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      create_db_backup:
        description: Create a PostgreSQL dump before deployment
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on production VM runner
    runs-on: [self-hosted, linux, arm64, ct-orbit-prod]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy from local checkout
        env:
          CREATE_DB_BACKUP: ${{ inputs.create_db_backup }}
          CT_ORBIT_APP_PATH: /home/timesheet/timesheet-app
          CT_ORBIT_FETCH_URL: ${{ github.workspace }}
          CT_ORBIT_BRANCH: HEAD
        run: |
          set -euo pipefail

          if [ "${CREATE_DB_BACKUP}" = "true" ]; then
            bash "${GITHUB_WORKSPACE}/scripts/prod-db-backup.sh"
          fi

          bash "${GITHUB_WORKSPACE}/scripts/prod-deploy.sh"
